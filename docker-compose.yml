services:
  db:
    image: postgres:16
    container_name: fixhub-db
    environment:
      POSTGRES_USER: fixhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixhub123}
      POSTGRES_DB: fixhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixhub -d fixhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fixhub-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development нужен, чтобы работал Swagger
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=fixhub;Username=fixhub;Password=${POSTGRES_PASSWORD:-fixhub123}"
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Jwt__Key: ${JWT_KEY:-fixhub-super-secret-key-change-me-0123456789}
      Admin__Password: ${ADMIN_PASSWORD:-Admin12345}
      # адрес фронтенда для ссылок в письмах (сброс пароля, уведомления)
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:5173}
      # почта для писем: пока SMTP_HOST пустой, письма только пишутся в лог контейнера
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_SSL:-true}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    volumes:
      # загруженные фото услуг, чтобы не терялись при пересборке контейнера
      - uploads:/app/uploads
      # документы мастеров для проверки: закрытая папка, наружу не отдаётся
      - private_uploads:/app/private-uploads
    ports:
      - "8080:8080"
    # в образе aspnet нет curl, поэтому /health запрашиваем средствами bash
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  uploads:
  private_uploads: